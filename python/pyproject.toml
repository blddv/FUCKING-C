[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fucking-c-language"
version = "2.0.0"
description = "A high-level programming language written with variations of C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fc = "fucking_c.cli:main"

[tool.setuptools.packages.find]
include = ["fucking_c*"]
